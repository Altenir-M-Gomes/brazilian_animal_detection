version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: deteccao-animais-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deteccao_animais
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deteccao_animais -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deteccao-animais-api
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/deteccao_animais
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    command: >
      bash -c "
        until pg_isready -h postgres -p 5432 -U postgres -d deteccao_animais; do
          echo 'Esperando PostgreSQL...';
          sleep 2;
        done;
        alembic upgrade head;
        python seed.py;
        uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    restart: always
    depends_on:
      - postgres

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: altenirm/deteccao-front-end:latest
    container_name: deteccao-front
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:4173"
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
