name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
workflow_dispatch:

env:
  IMAGE_NAME: altenirm/deteao-de-animais:latest
  KUBECTL_CONFIG: ${{ secrets.KUBECTL_CONFIG }}

jobs:
  build-docker-app:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker Image
        run: docker push $IMAGE_NAME

  deploy-app:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-docker-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBECTL_CONFIG}" > ~/.kube/config

      - name: Cleanup Old Resources
        run: |
          kubectl delete deployment servicos-publicos-api || true
          kubectl delete deployment servicos-publicos-mongodb || true
          kubectl delete configmap cservicos-publicos-mongodb-config || true
          kubectl delete configmap cservicos-publicos-api-config || true

      - name: Apply ConfigMaps
        run: |
          kubectl apply -f deploy/config-maps/servicos-publicos-mongo-config.yaml
          kubectl apply -f deploy/config-maps/servicos-publicos-api-config.yaml

      - name: Deploy MongoDB
        run: |
          kubectl apply -f deploy/deployments/servicos-publicos-mongodb.yaml
          sleep 60

      - name: Deploy API
        run: |
          kubectl apply -f deploy/deployments/servicos-publicos-api.yaml
          sleep 60

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl describe deploy/servicos-publicos-api
          kubectl logs deploy/servicos-publicos-api
