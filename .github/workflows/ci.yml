name: CI/CD Pipeline

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  buildar-docker-api:
    runs-on: ubuntu-latest
    environment: "Brazilian animais" # pega os secrets do ambiente

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar ambiente
        run: |
          ls -la
          cp /backend/.env.example /backend/.env
          echo "DB_URL=${{ secrets.DB_URL }}" >> /backend/.env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> /backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /backend/.env

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker Image
        run: docker push $IMAGE_NAME

  deploy-app:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: buildar-docker-api
    environment: "Brazilian animais" 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.IMAGEM_DOCKER }}

  fazer-deploy:
    runs-on: ubuntu-latest
    needs: buildar-docker-api
    environment: "Brazilian animais" # pega os secrets do ambiente

    steps:
      - name: Criar pasta kube
        run: mkdir -p ~/.kube
  
      - name: Criar kubeconfig a partir do secret
        run: echo "${KUBECTL_CONFIG}" > ~/.kube/config
        env:
          KUBECTL_CONFIG: ${{ secrets.KUBECTL_CONFIG }}
  
      - run: chmod 600 ~/.kube/config
  
      - uses: actions/checkout@v4
  
      - uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
  
      - name: Verificar cluster
        run: |
          kubectl config get-contexts
          kubectl get nodes

      - name: Remover deployment anterior
        run: kubectl delete deployment personal-finance-api || true

      - name: Aplicar novo deployment
        run: kubectl apply -f deploy/personal-finance-api-deployment.yaml

      - name: Aguardar rollout do deployment
        run: kubectl rollout status deployment/personal-finance-api --timeout=90s

      - name: Verificar status do deployment
        run: |
          kubectl get pods
          kubectl describe deploy/personal-finance-api
          kubectl logs deploy/personal-finance-api
