name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: altenirm/deteao-de-animais:latest

jobs:
  build-docker-app:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar ambiente
        run: |
          cp /backend/.env.example /backend/.env
          echo "DB_URL=${{ secrets.DB_URL }}" >> /backend/.env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> /backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /backend/.env

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker Image
        run: docker push $IMAGE_NAME

  deploy-app:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: buildar-docker-api
    environment: "Brazilian animais" 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECTL_CONFIG }}" > ~/.kube/config

      - name: Cleanup Old Resources
        run: |
          kubectl delete deployment servicos-publicos-api || true
          kubectl delete deployment servicos-publicos-mongodb || true
          kubectl delete configmap cservicos-publicos-mongodb-config || true
          kubectl delete configmap cservicos-publicos-api-config || true

      - name: Apply ConfigMaps
        run: |
          kubectl apply -f deploy/config-maps/servicos-publicos-mongo-config.yaml
          kubectl apply -f deploy/config-maps/servicos-publicos-api-config.yaml

      - name: Deploy MongoDB
        run: |
          kubectl apply -f deploy/deployments/servicos-publicos-mongodb.yaml
          kubectl rollout status deployment/servicos-publicos-mongodb

      - name: Deploy API
        run: |
          kubectl apply -f deploy/deployments/servicos-publicos-api.yaml
          kubectl rollout status deployment/servicos-publicos-api

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl describe deploy/servicos-publicos-api
          kubectl logs deploy/servicos-publicos-api
