apiVersion: apps/v1
kind: Deployment
metadata:
  name: deteccao-animais-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deteccao-animais-api
  template:
    metadata:
      labels:
        app: deteccao-animais-api
    spec:
      imagePullSecrets:
        - name: regcred   
      containers:
        - name: deteccao-animais-api
          image: altenirm/deteao-de-animais:latest
          ports:
            - containerPort: 8000   
          resources: {}

---
apiVersion: v1
kind: Service
metadata:
  name: deteccao-animais-api
spec:
  type: NodePort
  selector:
    app: deteccao-animais-api
  ports:
    - port: 80
      targetPort: 8000  
